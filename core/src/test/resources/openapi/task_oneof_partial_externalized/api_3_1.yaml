openapi: 3.1.0
info:
  title: Partial Task OneOf API
  version: 1.0.0
paths:
  /tasks:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '200':
          description: Task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
components:
  schemas:
    Task:
      oneOf:
        - $ref: '#/components/schemas/CardTask'
        - $ref: '#/components/schemas/BankTransferTask'
    CardTask:
      type: object
      required:
        - taskType
        - taskId
        - cardNumber
      properties:
        taskType:
          type: string
          enum:
            - card
        taskId:
          type: integer
        cardNumber:
          type: string
    BankTransferTask:
      type: object
      required:
        - taskType
        - taskId
        - accountNumber
      properties:
        taskType:
          type: string
          enum:
            - bank_transfer
        taskId:
          type: integer
        accountNumber:
          type: string
    TaskResponse:
      type: object
      required:
        - accepted
      properties:
        accepted:
          type: boolean
