openapi: 3.0.0
info:
  title: Response status selection
  version: 1.0.0
paths:
  /items:
    get:
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
        default:
          description: Other response
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
