openapi: 3.0.0
info:
  title: Nullable response array substitution
  version: 1.0.0
paths:
  /echo:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
      responses:
        '200':
          description: Echoed id
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  type: object
                  required:
                    - id
                  properties:
                    id:
                      type: string
